mutation ReopenNewStaffQuestionnaire(
  $input: NewStaffCohortAttendeeReopenQuestionnaireMutationInput!
) {
  reopenNewStaffQuestionnaire(input: $input) {
    newStaffCohortAttendee {
      id
      questionnaireState
      questionnaireLocked
      questionnaireReopenedAt
      goalStatus
    }
  }
}
