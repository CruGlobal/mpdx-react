query NewStaffScenarioGoals(
  $search: String
  $sortBy: NewStaffGoalCalculationSortEnum
  $after: String
) {
  newStaffScenarioGoals(
    search: $search
    sortBy: $sortBy
    first: 100
    after: $after
  ) {
    nodes {
      id
      firstName
      lastName
      ministryName
      geographicLocation
      createdAt
      # Drives the Calculation Status chip; see goalSettingsCompletion.
      maritalStatus
      calculationsYear
      age
      tenure
      assignmentType
      benefitsPlan
      spouseAge
      spouseTenure
      calculations {
        monthlyGoal
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation CreateNewStaffScenarioGoal {
  createNewStaffScenarioGoal(input: {}) {
    newStaffGoalCalculation {
      id
    }
  }
}

mutation DeleteNewStaffScenarioGoal($id: ID!) {
  deleteNewStaffScenarioGoal(input: { id: $id }) {
    id
  }
}
