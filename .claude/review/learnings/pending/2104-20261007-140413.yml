    message:
      EligibilityStatusTable grows to 12 parallel user*/spouse* scalar props
      (six matched pairs), so every added facet costs two props plus two
      threading sites in each consumer. The shape invites exactly the
      per-person/per-kind pairing mistakes this diff had to thread carefully.
