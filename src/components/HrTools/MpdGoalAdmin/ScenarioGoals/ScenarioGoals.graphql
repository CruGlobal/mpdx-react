query NewStaffScenarioGoals($after: String) {
  newStaffScenarioGoals(first: 100, after: $after) {
    nodes {
      id
      firstName
      lastName
      ministryName
      geographicLocation
      createdAt
      # Drives the Goal Status chip; see goalSettingsCompletion.
      maritalStatus
      calculationsYear
      age
      tenure
      assignmentType
      benefitsPlan
      spouseAge
      spouseTenure
      calculations {
        monthlyGoal
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation CreateNewStaffScenarioGoal {
  createNewStaffScenarioGoal(input: {}) {
    newStaffGoalCalculation {
      id
    }
  }
}

mutation DeleteNewStaffScenarioGoal($id: ID!) {
  deleteNewStaffScenarioGoal(input: { id: $id }) {
    id
  }
}
