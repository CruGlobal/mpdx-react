query GetUser {
  user {
    id
    firstName
    lastName
    avatar
    preferences {
      id
      language: locale
      locale: localeDisplay
    }
    staffAccountId
    canViewNewStaffCohorts
    primaryDesignation
    userType
    usStaffGroup
    spouseUsStaffGroup
    supervisesStaff
    mpdSupervisorAdmin
  }
}
