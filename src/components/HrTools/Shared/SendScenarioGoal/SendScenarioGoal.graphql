mutation SendNewStaffScenarioGoal($id: ID!, $emailAddresses: [String!]!) {
  sendNewStaffScenarioGoal(
    input: { id: $id, emailAddresses: $emailAddresses }
  ) {
    newStaffGoalCalculation {
      id
    }
    # Delivery is queued, so this is the address list rather than a receipt.
    sentTo
  }
}
