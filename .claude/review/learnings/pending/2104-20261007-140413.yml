    category: state-and-data-flow
    severity: 4
    file: src/components/HrTools/Shared/EligibilityStatusTable/eligibilityReasons.ts
    message: The new reason codes make the server authoritative for the
      Italy/non-Italy housing-kind split (ItalyMhi / NonItalyMha), but the table
      still derives every other Italy-dependent decision from the client-side
      country === 'IT' guess in getHousingKind. The two can disagree, so a user
      whose mhaEit code is ItalyMhi but whose staffInfo.country is not IT is
      told 'Must complete an MHI form instead' while the MHI rows and the
      paper-MHI note are both suppressed — an instruction with no way to act on
      it.
    outcome: ''
    dismissal_reason: ''
    reason: ''
  - id: f2
    signature: 6e62c7d23498
    agent: data-integrity
    category: standards-checklist
    severity: 4
    file: src/components/HrTools/Shared/EligibilityStatusTable/eligibilityReasons.ts
    message: Both reason maps are typed as a full
      Record<MinistersHousingIneligibilityReasonEnum, string> over an
      API-generated enum, so the next backend-added reason code breaks the
      TypeScript build even though the runtime already degrades gracefully. The
      repo rule for this tree requires Partial<Record<ApiEnum, T>> plus a
      runtime fallback precisely because these enums are in flux.
    outcome: ''
    dismissal_reason: ''
    reason: ''
