query GoalCalculatorConstants($year: Int) {
  constant {
    mpdGoalBenefitsConstants(year: $year) {
      id
      size
      sizeDisplayName
      plan
      planDisplayName
      cost
    }
    mpdGoalGeographicConstants(year: $year) {
      id
      location
      percentageMultiplier
    }
    mpdGoalMiscConstants(year: $year) {
      id
      category
      categoryDisplayName
      label
      labelDisplayName
      fee
    }
  }
}
