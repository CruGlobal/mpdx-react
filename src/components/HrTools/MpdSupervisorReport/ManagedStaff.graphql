query ManagedStaff(
  $first: Int
  $after: String
  $name: String
  $teamNames: [String!]
  $departments: [String!]
  $assignmentCategoryGroup: MpdAssignmentCategoryGroupEnum
  $negativeLastMonth: Boolean
  $negativeThreeMonths: Boolean
) {
  managedStaff(
    first: $first
    after: $after
    name: $name
    teamNames: $teamNames
    departments: $departments
    assignmentCategoryGroup: $assignmentCategoryGroup
    negativeLastMonth: $negativeLastMonth
    negativeThreeMonths: $negativeThreeMonths
  ) {
    nodes {
      firstName
      lastName
      spouseFirstName
      spouseLastName
      staffAccountId
      personNumber
      spousePersonNumber
      spouseStaffAccountId
      geographicLocation
      assignmentCategoryGroup
      teams {
        employee {
          id
          name
          department
        }
        spouse {
          id
          name
          department
        }
      }
      newStaffMonthlySalary
      quarterlyHealth {
        monthlyGrossSalary
        startingQuarter {
          quarter
          fiscalYear
          months {
            month
            payroll
            status
          }
        }
        completedQuarters {
          quarter
          fiscalYear
          averagePayroll
          status
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount
  }
}
