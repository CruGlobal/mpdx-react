    signature: 41de4da4906d
    agent: architecture
    category: pattern-consistency
    severity: 3
    file: src/components/HrTools/SalaryCalculator/YourInformation/MhaRequestSection/MhaRequestSection.tsx
    message:
      'This call site drops the `hasSpouse ? … : undefined` gating on every
      spouse prop while the only other call site of the same shared component
      keeps the equivalent `isMarried ?` gating on all of them. The two
      consumers now follow opposite conventions for the same six spouse props.'
    outcome: ''
    dismissal_reason: ''
    reason: ''
  - id: f4
    signature: 0fb2d7701fa2
    agent: architecture
    category: robustness
    severity: 3
    file: src/components/HrTools/Shared/EligibilityStatusTable/eligibilityReasons.ts
    message:
      "getIneligibilityReason maps the NonItalyMha code to 'Not applicable',
      which defeats the graceful fallback the function is built around: an
      unrecognized code degrades to the country-based guess, but this
      known-yet-inapplicable code renders 'Not applicable' in the Reason cell of
      a row whose Eligibility cell reads 'Ineligible'."
    outcome: ''
    dismissal_reason: ''
    reason: ''
  - id: f5
    signature: 4c2165cd55a3
    agent: testing
    category: test-coverage-gap
    severity: 3
    file: src/components/HrTools/Shared/EligibilityStatusTable/eligibilityReasons.ts
    message:
      Several map entries are commented "Unreachable" (e.g. NonItalyMha in
      MHA results, ItalyMhi in MHI results) based on an assumption about what
      the backend can send, but nothing enforces or tests that invariant — if
      the API ever does send one of these combinations, the UI would silently
      show a misleading "Not applicable" or wrong-category message with no test
      to catch it.
    outcome: ''
    dismissal_reason: ''
    reason: ''
  - id: f6
    signature: 4befbf61f1bf
    agent: testing
    category: test-coverage-gap
    severity: 3
    file: src/components/HrTools/Shared/EligibilityStatusTable/eligibilityReasons.ts
    message:
      The fallback branch for an ineligibility reason code the client does
      not recognize (e.g. a new enum value the API ships before this client
      redeploys) is never exercised by a test — only the null-code fallback is
      covered.
    outcome: ''
    dismissal_reason: ''
    reason: ''
  - id: f7
