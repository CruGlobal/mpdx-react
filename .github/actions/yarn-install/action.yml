name: Install Dependencies
description: Install Yarn packages, reusing a cached .yarn/cache when yarn.lock is unchanged

inputs:
  save-cache:
    description: Save .yarn/cache after a cache miss. Set it on one job so parallel jobs don't race to save the same key.
    default: 'false'

runs:
  using: composite
  steps:
    # No restore-keys: checkout skips git-lfs, so .yarn/cache holds LFS pointer files, and a partial
    # restore would leave pointers for any package it lacks. Only an exact match replaces all of them.
    - name: Restore Yarn cache
      id: yarn-cache
      uses: actions/cache/restore@v6
      with:
        path: .yarn/cache
        key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

    - name: Install
      shell: bash
      env:
        CACHE_HIT: ${{ steps.yarn-cache.outputs.cache-hit }}
      run: |
        # On a miss, download packages from the registry instead of git-lfs to save git-lfs bandwidth
        if [ "$CACHE_HIT" != 'true' ]; then
          yarn cache clean
        fi
        yarn install

    - name: Save Yarn cache
      if: inputs.save-cache == 'true' && steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .yarn/cache
        key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
