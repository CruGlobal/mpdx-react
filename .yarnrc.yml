cacheMigrationMode: required-only

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

supportedArchitectures:
  cpu:
    - x64
    - arm64
    - x86
  libc:
    - glibc
    - musl
  os:
    - linux
    - darwin
    - win32

yarnPath: .yarn/releases/yarn-4.14.1.cjs


# Baselined so the required audit only fails on new findings; clear this list, don't grow it.
npmAuditIgnoreAdvisories:
  # next 15.0, until the Next 15.5 upgrade
  - '1111372'
  - '1111390'
  - '1112653'
  - '1113688'
  - '1116376'
  - '1117931'
  - '1118950'
  - '1118954'
