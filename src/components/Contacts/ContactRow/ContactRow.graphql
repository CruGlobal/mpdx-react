fragment ContactRow on Contact {
  id
  avatar
  name
  primaryAddress {
    ...ContactRowAddress
  }
  status
  pledgeAmount
  pledgeFrequency
  pledgeCurrency
  pledgeReceived
  lateAt
  pledgeStartDate
  sendNewsletter
  starred
  uncompletedTasksCount
  ...CelebrationItems
}

fragment ContactRowAddress on Address {
  id
  street
  city
  state
  postalCode
  country
  geo
  source
  createdAt
}
